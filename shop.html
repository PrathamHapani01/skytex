<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - Sky Tex</title>
  <meta name="description" content="Shop premium fabrics at Sky Tex. Browse our complete collection of eco-friendly textiles including linen, cotton, silk, wool, and more. Order swatch kits available." />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Sky Tex" class="logo__img" />
        <span>Sky Tex</span>
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html" class="is-active">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container content-page">
    <h1>All fabrics</h1>
    <p>The complete library.</p>
    <div class="filter-bar">
      <select id="material-filter" class="filter-select">
        <option value="">All Materials</option>
        <option value="Linen">Linen</option>
        <option value="Cotton">Cotton</option>
        <option value="Silk">Silk</option>
        <option value="Wool">Wool</option>
        <option value="Tapeta">Tapeta</option>
      </select>
      <select id="colour-filter" class="filter-select">
        <option value="">All Colours</option>
        <option value="Beige">Beige</option>
        <option value="White">White</option>
        <option value="Champagne">Champagne</option>
        <option value="Grey">Grey</option>
        <option value="Multi">Multi</option>
        <option value="Navy">Navy</option>
      </select>
      <select id="price-filter" class="filter-select">
        <option value="">All Prices</option>
        <option value="low">Under ₹400</option>
        <option value="medium">₹400 - ₹600</option>
        <option value="high">Above ₹600</option>
      </select>
    </div>
    <div id="shop-grid" class="product-grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container"><p class="footer-bottom">© 2026 Sky Tex Textile Atelier. All rights reserved.</p></div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("shop-grid");
      const materialFilter = document.getElementById("material-filter");
      const colourFilter = document.getElementById("colour-filter");
      const priceFilter = document.getElementById("price-filter");

      function renderProducts(products) {
        if (grid && products) {
          grid.innerHTML = products.map(product => `
            <a href="product.html?id=${product.id}" class="product-card" aria-label="View ${product.name}">
              <img src="${product.images[0]}" alt="${product.name}" class="product-card__img" onerror="this.src='https://via.placeholder.com/400x400/f7f4ef/2c2824?text=Image+Not+Available'" />
              <div class="product-card__content">
                <h3>${product.name}</h3>
                <p class="product-card__price">₹${product.price}/meter</p>
              </div>
            </a>
          `).join('');
        }
      }

      function filterProducts() {
        let filtered = [...PRODUCTS];
        const material = materialFilter.value;
        const colour = colourFilter.value;
        const price = priceFilter.value;

        if (material) {
          filtered = filtered.filter(p => p.material === material);
        }

        if (colour) {
          filtered = filtered.filter(p => p.colour === colour);
        }

        if (price === 'low') {
          filtered = filtered.filter(p => p.price < 400);
        } else if (price === 'medium') {
          filtered = filtered.filter(p => p.price >= 400 && p.price <= 600);
        } else if (price === 'high') {
          filtered = filtered.filter(p => p.price > 600);
        }

        renderProducts(filtered);
      }

      materialFilter.addEventListener('change', filterProducts);
      colourFilter.addEventListener('change', filterProducts);
      priceFilter.addEventListener('change', filterProducts);

      // Check URL params for initial filter
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('material')) {
        materialFilter.value = urlParams.get('material');
      }

      renderProducts(PRODUCTS);
      filterProducts();
    });
  </script>
</body>
</html>
