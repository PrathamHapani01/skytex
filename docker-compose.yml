version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - .:/frontend
      - ./backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://admin:${DB_PASSWORD}@db:5432/skytex

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: skytex
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
