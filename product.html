<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product - Sky Tex</title>
  <meta name="description" content="View detailed fabric specifications at Sky Tex. Browse our premium collection of linen, cotton, silk, and wool textiles with full product details." />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Sky Tex" class="logo__img" />
        <span>Sky Tex</span>
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container content-page">
    <div id="product-detail"></div>
    <section class="related-fabrics">
      <h2>Related Fabrics</h2>
      <div id="related-grid" class="related-fabrics__grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p class="footer-bottom">© 2026 Sky Tex Textile Atelier. All rights reserved.</p></div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get('id'));
      const product = PRODUCTS.find(p => p.id === productId);
      const detailContainer = document.getElementById("product-detail");
      const relatedGrid = document.getElementById("related-grid");

      if (product && detailContainer) {
        const specsHtml = Object.entries(product.specifications || {}).map(([key, value]) => `
          <dt class="spec-label">${key}</dt>
          <dd class="spec-value">${value}</dd>
        `).join('');

        detailContainer.innerHTML = `
          <div class="product-detail__layout">
            <div class="product-gallery">
              <div class="gallery-main">
                <img id="main-image" src="${product.images[0]}" alt="${product.name}" class="gallery-main__img" onerror="this.src='https://via.placeholder.com/600x600/f7f4ef/2c2824?text=Image+Not+Available'" />
              </div>
              <div class="gallery-thumbs">
                ${product.images.map((img, i) => `
                  <button class="gallery-thumb ${i === 0 ? 'is-active' : ''}" onclick="changeImage('${img}', this)" aria-label="View image ${i + 1}">
                    <img src="${img}" alt="${product.name} ${i + 1}" onerror="this.src='https://via.placeholder.com/100x100/f7f4ef/2c2824?text=+'" />
                  </button>
                `).join('')}
              </div>
            </div>
            <div class="product-info">
              <h1>${product.name}</h1>
              <p class="product-info__price">₹${product.price}/meter</p>
              <p class="product-info__material">${product.material}</p>
              <div class="product-info__availability">✓ ${product.availability || 'In Stock'}</div>
              <p class="product-info__desc">${product.description}</p>
              
              <div class="product-info__specs">
                <h4>Fabric Specifications</h4>
                <dl class="spec-list">${specsHtml}</dl>
              </div>
              
              <a href="${whatsappProductLink(product.name, product.price)}" target="_blank" class="btn btn--whatsapp btn--block btn--large">
                <svg class="btn__icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                Order on WhatsApp
              </a>
            </div>
          </div>
        `;

        // Related fabrics (exclude current product)
        if (relatedGrid) {
          const relatedProducts = PRODUCTS.filter(p => p.id !== productId).slice(0, 4);
          relatedGrid.innerHTML = relatedProducts.map(p => `
            <a href="product.html?id=${p.id}" class="product-card" aria-label="View ${p.name}">
              <img src="${p.images[0]}" alt="${p.name}" class="product-card__img" onerror="this.src='https://via.placeholder.com/400x400/f7f4ef/2c2824?text=Image+Not+Available'" />
              <div class="product-card__content">
                <h3>${p.name}</h3>
                <p class="product-card__price">₹${p.price}/meter</p>
              </div>
            </a>
          `).join('');
        }
      } else {
        detailContainer.innerHTML = '<p>Product not found</p>';
      }
    });

    function changeImage(src, btn) {
      const mainImg = document.getElementById('main-image');
      if (mainImg) {
        mainImg.src = src;
      }
      document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('is-active'));
      btn.classList.add('is-active');
    }
  </script>
</body>
</html>
